name: reon
description: Reon — End-to-end encrypted messaging
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  # Networking + cookies
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  # Real-time
  socket_io_client: ^2.0.3+1
  # Secure key storage
  flutter_secure_storage: ^9.0.0
  # State management
  provider: ^6.1.2
  # E2E crypto (RSA-OAEP + AES-GCM)
  pointycastle: ^3.9.1
  # Device linking + settings
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.0.7
  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  # Offline cache
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  # External links (Google OAuth, etc.)
  url_launcher: ^6.3.0
  # Runtime permission requests (camera, notifications, storage)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
